# Global config with safe defaults
backend: ollama                  # can be: ollama or fallback
model: gpt-oss:20b              # default local model name
temperature: 0.2
max_tokens: 600
timezone: America/New_York
memory_db_path: data/intuition.db
log_path: data/log.txt
planner_schema_path: config/planner_schema.json
system_prompt_path: config/system_prompt.txt

voice:
  enabled: true
  model: base        # tiny (fastest) | base | small | medium (most accurate)
  language: en

# Bounds on one tool-loop turn. A local 20B model on consumer hardware will
# otherwise iterate for minutes; both limits are enforced, whichever hits first.
brain:
  max_iters: 5          # tool calls per turn
  budget_ms: 20000      # wall clock per turn
  history_turns: 6      # conversational turns carried into the prompt

# The episode log records every input you submit, locally, so the predictor has
# something to learn from. Nothing leaves this machine. Turn it off here, erase
# what is already there with /forget, and see it with /episodes.
episodes:
  enabled: true

anticipation:
  enabled: true
  debounce_ms: 180
  match_threshold: 0.6

hardware:
  drivers:
    - name: led_strip
      simulate: true
      port: null
    - name: gpu_nvml
      enabled: true
    - name: cpu_info
      enabled: true
