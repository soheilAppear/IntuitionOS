# Global config with safe defaults
backend: ollama                  # can be: ollama or fallback
model: gpt-oss:20b              # default local model name
temperature: 0.2
max_tokens: 600
timezone: America/New_York
memory_db_path: data/intuition.db
log_path: data/log.txt
planner_schema_path: config/planner_schema.json
system_prompt_path: config/system_prompt.txt

voice:
  enabled: true
  model: base        # tiny (fastest) | base | small | medium (most accurate)
  language: en

# Bounds on one tool-loop turn. A local 20B model on consumer hardware will
# otherwise iterate for minutes; both limits are enforced, whichever hits first.
brain:
  max_iters: 5          # tool calls per turn
  budget_ms: 20000      # wall clock per turn
  history_turns: 6      # conversational turns carried into the prompt

# The episode log records every input you submit, locally, so the predictor has
# something to learn from. Nothing leaves this machine. Turn it off here, erase
# what is already there with /forget, and see it with /episodes.
episodes:
  enabled: true

anticipation:
  enabled: true
  debounce_ms: 180
  match_threshold: 0.6   # superseded by thresholds.free when that block is set

# Cost-gated action thresholds. One threshold used to govern everything, which
# meant a hunch's strength did no work in a system whose whole thesis is that
# hunches vary in strength. The asymmetry between `free` and `reveal` is the
# point: prewarming wrongly wastes a few background milliseconds, while revealing
# wrongly costs the user the attention to notice and dismiss a bad suggestion.
thresholds:
  free:          0.30   # prewarm; being wrong costs cycles only
  reveal:        0.70   # show a ghost hint; being wrong costs user attention
  auto_execute:  0.95   # act without asking; reversible capabilities only
  irreversible:  null   # never auto-execute, regardless of confidence

# Consolidation (/dream). Runs offline, on demand, and is the one place the
# language model earns its cost: it judges whether a recurring pattern is a real
# habit and names it in a sentence. The rule it writes is then consulted with no
# model in the query path — a multi-second model cannot sit inside a keystroke.
consolidation:
  window: 2000         # episodes examined per run
  min_support: 4       # fewer occurrences than this is an anecdote, not a habit
  min_confidence: 0.5  # and it must beat the alternatives in the same situation

# What the predictor learns from, and when it starts trusting itself.
prediction:
  half_life_s: 604800    # one week: fast enough to follow a change of project,
                         # slow enough that Monday still remembers Friday
  min_episodes: 50       # below this the learned scores are noise and the
                         # original prefix heuristics are used instead
  replay_limit: 5000     # episodes replayed at startup when no state is saved

hardware:
  drivers:
    - name: led_strip
      simulate: true
      port: null
    - name: gpu_nvml
      enabled: true
    - name: cpu_info
      enabled: true
